name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mínima soportada (composer.json → platform) y la que usamos en desarrollo.
        php: ['8.2', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Formato (Pint)
        run: vendor/bin/pint --test

      - name: Tests (Pest)
        run: php artisan test

  audit:
    # Separado de los tests: una alerta nueva publicada upstream se ve en rojo,
    # pero no bloquea fusionar PRs que no tienen nada que ver.
    name: Seguridad de dependencias
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: composer audit
        run: composer audit --locked
