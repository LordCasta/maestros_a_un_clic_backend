# Maestros a un clic: frontend, API y WebSockets en un solo dominio.
# provision.sh reemplaza __DOMAIN__ y __PHP__; Certbot agrega después el bloque HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Frontend (Vue): cualquier ruta que no sea un archivo devuelve index.html.
    root /var/www/maestros-frontend;
    index index.html;
    client_max_body_size 40M;   # documentos de verificación de hasta 10 MB, varios por solicitud

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos compilados llevan hash en el nombre: se pueden guardar en caché mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API Laravel: /api, archivos públicos (/storage) y salud (/up).
    location ~ ^/(api|up)(/|$) {
        root /var/www/maestros-backend/public;
        try_files $uri /index.php?$query_string;
    }
    location /storage/ {
        root /var/www/maestros-backend/public;
        try_files $uri =404;
    }
    location = /index.php {
        root /var/www/maestros-backend/public;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php__PHP__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Reverb: /app (WebSockets del navegador) y /apps (Laravel publica los eventos).
    location ~ ^/apps?/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
